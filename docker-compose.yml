services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cellmane
      POSTGRES_USER: cellmane
      POSTGRES_PASSWORD: cellmane
    ports:
      - "5432:5432"
    volumes:
      - cellmane_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cellmane -d cellmane"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cellmane_postgres_data:
